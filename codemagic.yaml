workflows:
  pr-check:
    name: PR Check (analyze + test)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    triggering:
      events:
        - pull_request
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run codegen
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test

  android-beta:
    name: Android Beta (Play internal)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        # Configure on Codemagic UI when Play Console service account ready
        - google_play_credentials
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*-beta'
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Codegen
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Build AAB
        script: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
    # publishing block deferred until Play Console service account configured
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal

